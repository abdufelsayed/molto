name: Update Homebrew formula

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-formula:
    if: ${{ !contains(github.ref_name, 'dev') && (!github.event.release.prerelease || contains(github.ref_name, 'rc')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Calculate sha256
        id: sha
        run: |
          sha=$(curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/molto.rb")
          text = path.read_text()
          text = re.sub(r'^  (?:url|sha256) ".*"\n', '', text, flags=re.MULTILINE)
          source = f'  url "https://github.com/{os.environ["GITHUB_REPOSITORY"]}/archive/refs/tags/{os.environ["GITHUB_REF_NAME"]}.tar.gz"\n'
          source += f'  sha256 "{os.environ["SOURCE_SHA256"]}"\n'
          text = re.sub(r'(^  homepage ".*"\n)', lambda m: m.group(0) + source, text, count=1, flags=re.MULTILINE)
          path.write_text(text)
          PY
        env:
          SOURCE_SHA256: ${{ steps.sha.outputs.sha256 }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/molto.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "formula: bump to ${{ steps.version.outputs.version }}"
          git push
