name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # PRs use the oldest supported Python; main pushes cover the full range.
        python-version: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["3.11"]')
          || fromJSON('["3.11", "3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          python -m pip install uv==0.12.9

      - name: Sync locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}" --extra mcp

      - name: Lint maintained native and management modules
        run: |
          uv run --locked ruff check --select E4,E7,E9,F setup.py omlx/custom_kernels
          uv run --locked ruff check omlx/auth.py omlx/services/management_models.py omlx/api/management_routes.py omlx/services/management.py
          uv run --locked ruff format --check setup.py omlx/auth.py omlx/services/management_models.py omlx/api/management_routes.py omlx/services/management.py

      - name: Type-check build and management modules
        run: uv run --locked mypy --follow-imports=skip setup.py omlx/auth.py omlx/services/management_models.py omlx/api/management_routes.py omlx/services/management.py

      - name: Run unit tests
        run: >-
          uv run --locked pytest tests/
          --durations=50 --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14
