[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-cli"
version = "0.7.0rc1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "omlx-config",
  "omlx-server",
  "omlx-runtime",
  "requests>=2.28",
  "rich>=13",
  "httpx>=0.27,<1",
  "psutil>=5.9",
  "pyyaml>=6",
]

[project.scripts]
omlx = "omlx_cli.cli:main"

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.txt", "*.md", "LICENSE"]
omlx_cli = ["_dashboard/**/*"]

[tool.setuptools.packages.find]
where = ["src"]
