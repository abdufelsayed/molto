[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molto-cli"
version = "0.1.0.dev0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "molto-config",
  "molto-server",
  "molto-runtime",
  "requests>=2.28",
  "rich>=13",
  "httpx>=0.27,<1",
  "psutil>=5.9",
  "pyyaml>=6",
]

[project.scripts]
molto = "molto_cli.cli:main"

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.txt", "*.md", "LICENSE"]
molto_cli = ["_dashboard/**/*"]

[tool.setuptools.packages.find]
where = ["src"]
