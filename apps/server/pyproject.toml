[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-server"
version = "0.7.0rc1"
requires-python = ">=3.11,<3.14"
dependencies = [
  "omlx-config",
  "omlx-contracts",
  "omlx-management",
  "omlx-runtime",
  "fastapi>=0.108",
  "uvicorn>=0.23",
  "python-multipart>=0.0.5",
  "httpx>=0.27,<1",
  "pydantic>=2",
  "starlette>=0.40",
  "pyyaml>=6",
  "Pillow>=9",
  "mlx==0.32.2",
  "soundfile>=0.12",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@872ae88d1fac77350db23c8c04fe8dd372a9e3e8",
  "mlx-audio @ git+https://github.com/Blaizzy/mlx-audio@49596ac8b69b9ed377db311a73df838795f38a3d",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0.0,<3"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.txt", "*.md", "LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
