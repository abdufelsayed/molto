[project]
name = "omlx-workspace"
version = "0.7.0rc1"
requires-python = ">=3.11,<3.14"
dependencies = []
description = "LLM inference server, optimized for your Mac"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "omlx contributors" }]
keywords = ["llm", "mlx", "apple-silicon", "vllm", "inference", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jundot/omlx"
Documentation = "https://github.com/jundot/omlx#readme"
Repository = "https://github.com/jundot/omlx"


[dependency-groups]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "setuptools>=77",
  "wheel",
  "build",
  "mcp>=2.0.0,<3",
  "xgrammar==0.2.3",
  "apache-tvm-ffi==0.1.11",
]

[tool.uv]
package = false
override-dependencies = [
  "mlx==0.32.2",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@872ae88d1fac77350db23c8c04fe8dd372a9e3e8",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Upstream model files are loaded with mlx_lm's package context and kept verbatim.
extend-exclude = [
  "packages/runtime/src/omlx_runtime/patches/*/vendor",
  "packages/runtime/src/omlx_runtime/patches/bailing_hybrid/bailing_hybrid_model.py",
  "packages/runtime/src/omlx_runtime/patches/hy_v3/hy_v3_model.py",
  "packages/runtime/src/omlx_runtime/patches/hy_v3/hy_v3_opensource_tool_parser.py",
  "packages/runtime/src/omlx_runtime/patches/mimo_v2/mimo_v2_model.py",
  "packages/runtime/src/omlx_runtime/patches/deepseek_v4/deepseek_v4_model.py",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.workspace]
members = ["apps/cli", "apps/server", "packages/*"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B006",
  "B012",
  "B014",
  "B018",
  "B021",
  "B024",
  "B027",
  "B033",
  "B034",
]
# Single-letter matrix dimensions and small callable adapters are conventional here.
ignore = ["E731", "E741", "UP031", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally prepare imports and retain setup results for their lifetime.
"**/tests/**/*.py" = ["E402", "F841"]

[tool.pytest.ini_options]
testpaths = [
  "apps/cli/tests",
  "apps/server/tests",
  "packages/config/tests",
  "packages/contracts/tests",
  "packages/management/tests",
  "packages/runtime/tests",
  "tests/integration",
  "tooling/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
  ".",
  "tests",
  "apps/cli/tests",
  "apps/server/tests",
  "packages/runtime/tests",
  "tooling/tests",
  "packages/config/tests",
  "packages/contracts/tests",
  "packages/management/tests",
  "apps/cli/src",
  "apps/server/src",
  "packages/config/src",
  "packages/contracts/src",
  "packages/management/src",
  "packages/runtime/src",
]
asyncio_mode = "auto"
markers = [
  "slow: requires model loading",
  "integration: requires a running server",
  "turboquant: TurboQuant KV cache tests",
]
addopts = "-v --tb=short -m \"not slow and not integration\""
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.uv.sources.omlx-cli]
workspace = true

[tool.uv.sources.omlx-server]
workspace = true

[tool.uv.sources.omlx-config]
workspace = true

[tool.uv.sources.omlx-contracts]
workspace = true

[tool.uv.sources.omlx-management]
workspace = true

[tool.uv.sources.omlx-runtime]
workspace = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
