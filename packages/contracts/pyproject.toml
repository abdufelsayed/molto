[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-contracts"
version = "0.7.0rc1"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.txt", "*.md", "LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
