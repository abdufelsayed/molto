[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molto-management"
version = "0.1.0.dev0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "molto-config",
  "molto-contracts",
  "molto-runtime",
  "httpx>=0.27,<1",
  "huggingface-hub>=1.19",
  "requests>=2.28",
  "psutil>=5.9",
  "ddgs==9.16.0",
  "pydantic>=2",
  "rich>=13",
  "packaging>=24",
  "safetensors>=0.4",
  "mlx==0.32.2",
]

[project.optional-dependencies]
modelscope = ["modelscope>=1.10.0"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.jsonl", "*.txt", "*.md", "LICENSE"]
molto_management = ["management_presets.json"]

[tool.setuptools.packages.find]
where = ["src"]
